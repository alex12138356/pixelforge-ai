<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>模拟支付</title>
<style>
body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f5f5f5}
.card{background:white;border-radius:16px;padding:40px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:400px}
.price{font-size:36px;font-weight:800;color:#1677ff;margin:12px 0}
.btn{background:#1677ff;color:white;border:none;padding:14px 40px;border-radius:8px;font-size:16px;cursor:pointer;margin:8px}
.btn:hover{opacity:.9}
.note{font-size:12px;color:#999;margin-top:12px}
</style></head><body>
<div class="card">
<div style="font-size:48px">&#x1F4B5;</div>
<h2>模拟支付（开发模式）</h2>
<p style="color:#666">测试支付宝扫码支付流程</p>
<div class="price" id="amount">--</div>
<p style="color:#666;font-size:14px" id="orderInfo">订单号: --</p>
<button class="btn" onclick="pay()">&#x2705; 模拟支付成功</button>
<p class="note">点击按钮模拟支付成功，页面会自动关闭</p>
</div>
<script>
var params = new URLSearchParams(window.location.search);
document.getElementById('amount').textContent = '\u00a5' + (params.get('amount') || '0.00');
document.getElementById('orderInfo').textContent = '订单号: ' + (params.get('trade_no') || '--');
function pay(){
  fetch('/api/mock-pay?trade_no=' + params.get('trade_no'))
    .then(function(r){return r.json()})
    .then(function(d){
      document.querySelector('.card').innerHTML = '<div style="font-size:64px">&#x2705;</div><h2>支付成功!</h2><p style="color:#666">3秒后自动关闭，请返回原页面</p>';
      setTimeout(function(){window.close()}, 3000);
    });
}
</script></body></html>
